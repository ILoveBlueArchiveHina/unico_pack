robot_state_publisher:
  ros__parameters:
    use_sim_time: False

# 航向平滑器：不改路徑幾何，只把每個路徑點的 yaw 改寫成「面向貨物」，
# 讓 MPPI 的 PathAlignCritic (use_path_orientations: true) 把航向納入同一個最佳化。
smoother_server:
  ros__parameters:
    use_sim_time: False
    smoother_plugins: ["face_target"]
    face_target:
      plugin: "nav2_face_target_smoother::FaceTargetSmoother"
      target_frame: "map"                    # /tracking_center 所在的座標系（貨物座標請以此發布）
      tracking_center_topic: "/tracking_center"
      inactive_behavior: "face_goal"         # z<=0 或尚未收到時：改為面向終點；設 "pass_through" 則不動朝向
      apply_to_goal_pose: true               # 連終點 pose 的 yaw 也改寫，與 goal_checker 一致
      min_target_distance: 0.2               # 距目標小於此值的點沿用前一個 yaw（避免方位角發散）

waypoint_follower:
  ros__parameters:
    use_sim_time: False
    loop_rate: 10              # 20 -> 10
    stop_on_failure: False
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 0

velocity_smoother:
  ros__parameters:
    use_sim_time: False
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.8, 0.8, 0.0]
    min_velocity: [-0.8, -0.8, 0.0]
    max_accel: [1.0, 1.0, 0.0]
    max_decel: [-2.5, -2.5, 0.0]
    deadband_velocity: [0.05, 0.05, 0.0]  # 速度變化小於此值時不發出新指令，消除微抖動
    velocity_timeout: 1.0